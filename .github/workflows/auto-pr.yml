name: Auto PR Creation

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to open the pull request from
        required: false
        type: string
      base_branch:
        description: Branch to target for the pull request
        required: false
        default: main
        type: string
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create or update pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch || github.ref_name }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch || 'main' }}
        run: node .github/scripts/create-pr.mjs
